name: Sendoff
options:
  bundleIdPrefix: com.dahvio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""           # set in Xcode > Signing, or in Config/Local.xcconfig
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Sendoff:
    type: application
    platform: iOS
    sources:
      - path: Sendoff
    dependencies:
      - package: Supabase
        product: Supabase
      - target: SendoffClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dahvio.sendoff
        INFOPLIST_KEY_CFBundleDisplayName: Sendoff
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Sendoff uses the camera so you can add a photo or a short video."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sendoff uses the microphone so you can record a voice note."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sendoff lets you pick photos from your library to add to a Sendoff."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Sendoff can play a song from your Apple Music library during the reveal."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sendoff/Sendoff.entitlements
    entitlements:
      path: Sendoff/Sendoff.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:$(PUBLIC_HOST)
          - appclips:$(PUBLIC_HOST)
    info:
      path: Sendoff/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sendoff]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        PublicHost: $(PUBLIC_HOST)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        MusicBaseURL: $(MUSIC_BASE_URL)

  # The App Clip: the contribute flow for iPhones without the app, launched from the shared
  # link or the QR code. Shares source with the app; no StoreKit, no reveal, no organizer tools.
  # Keep it small: the uncompressed limit is 15 MB on iOS 16+.
  SendoffClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: SendoffClip
      - path: Sendoff/App/AppConfig.swift
      - path: Sendoff/App/AppEnvironment.swift
      - path: Sendoff/Models
      - path: Sendoff/Design
      - path: Sendoff/Services
        excludes:
          - Purchases.swift
      - path: Sendoff/Features/Contribute
      - path: Sendoff/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dahvio.sendoff.Clip
        INFOPLIST_KEY_CFBundleDisplayName: Sendoff
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Sendoff uses the camera so you can add a photo or a short video."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sendoff uses the microphone so you can record a voice note."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sendoff lets you pick photos from your library to add to a Sendoff."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SendoffClip/SendoffClip.entitlements
    entitlements:
      path: SendoffClip/SendoffClip.entitlements
      properties:
        com.apple.developer.associated-domains:
          - appclips:$(PUBLIC_HOST)
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.dahvio.sendoff
    info:
      path: SendoffClip/Info.plist
      properties:
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        PublicHost: $(PUBLIC_HOST)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)

  SendoffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SendoffTests
    dependencies:
      - target: Sendoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dahvio.sendoff.tests

schemes:
  Sendoff:
    build:
      targets:
        Sendoff: all
        SendoffTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Sendoff.storekit
    test:
      config: Debug
      targets: [SendoffTests]
