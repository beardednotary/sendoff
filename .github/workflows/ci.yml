name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web typecheck, build, smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/app/e2e/shots

  database:
    name: Migrations and privacy rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and rules test on a throwaway Postgres
        run: supabase/tests/run.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin

  ios:
    name: iOS build and unit tests
    # supabase-swift needs Swift tools 6.1 (Xcode 16.3 or later); the latest image has it.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the project (MockStore, no signing)
        run: |
          sed -e 's/^SUPABASE_ANON_KEY = .*/SUPABASE_ANON_KEY =/' -e 's/^DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM =/' \
            Config/Local.xcconfig.example > Config/Local.xcconfig
          xcodegen generate
      - name: Build the app and App Clip, run the unit tests
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project Sendoff.xcodeproj -scheme Sendoff -destination "id=$udid" test CODE_SIGNING_ALLOWED=NO
