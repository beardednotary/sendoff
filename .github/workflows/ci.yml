name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web typecheck, build, smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/app/e2e/shots

  database:
    name: Migrations and privacy rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and rules test on a throwaway Postgres
        run: supabase/tests/run.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin

  # The iOS build needs a Mac runner (macos-14, xcodegen, xcodebuild). Add it once the
  # project compiles locally; see README "Run the iOS app".
