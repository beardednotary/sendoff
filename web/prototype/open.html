<!doctype html>
<html lang="en" data-theme="midnight_toast">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Sendoff for Maria Reyes</title>
<meta name="description" content="Sealed. Opens when the time comes.">
<link rel="stylesheet" href="sendoff.css">
</head>
<body>
<div class="topbar">
  <span class="stamp" id="previewStamp" hidden>Preview</span>
  <span></span>
  <button class="close" aria-label="Close" onclick="history.back()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<!-- Sealed -->
<section class="stage active" id="sealed">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Sealed envelope for Maria Reyes from 47 people. Tap to open.">
    <div class="body"></div>
    <div class="address">
      <div class="caption">To</div>
      <div class="display" style="font-size:clamp(26px,6vw,34px)">Maria Reyes</div>
      <div class="signature">From the whole fourth floor</div>
    </div>
    <div class="flap"></div>
    <div class="seal-mark" style="--s:20%; width:20%; height:auto; aspect-ratio:1; font-size:clamp(26px,6.5vw,40px)">M</div>
    <div class="ribbon"><span>47 people</span><i></i></div>
  </div>
  <p class="ui" style="text-align:center; color:var(--muted); margin:0">Tap the seal</p>
</section>

<!-- Cover -->
<section class="stage" id="cover">
  <span class="stamp">Retirement</span>
  <h1 class="display" style="font-size:clamp(40px,10vw,56px)">Maria Reyes</h1>
  <div class="signature">From the whole fourth floor</div>
  <hr class="rule" style="margin:8px 0">
  <p class="entry">Thirty-one years. We tried to fit it in here.</p>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:40px">
    <div class="ribbon"><span>47 people</span><i></i></div>
    <span class="caption">Tap or swipe to begin</span>
  </div>
</section>

<!-- Entries -->
<section class="stage" id="entries">
  <div id="entryHost"></div>
  <div class="caption" style="text-align:center" id="counter"></div>
  <div class="dots" id="dots"></div>
</section>

<!-- Kept -->
<section class="stage" id="kept" style="text-align:center; align-items:center">
  <svg class="pathmark" style="--s:84px" viewBox="0 0 1024 1024" aria-label="Sendoff"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2F52"/><stop offset="1" stop-color="#11213F"/></linearGradient><linearGradient id="road" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F4E9D6"/><stop offset="1" stop-color="#E8D5B6"/></linearGradient><linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#C9A24A"/><stop offset="1" stop-color="#E6CB85"/></linearGradient></defs><rect width="1024" height="1024" rx="228" fill="url(#sky)"/><path fill="url(#road)" d="M100 1024C190 850 480 800 585 680 680 570 590 475 470 405 395 360 430 290 610 232 720 197 820 170 905 148 845 190 760 220 690 248 560 302 575 350 650 392 820 480 830 630 720 740 630 830 625 920 650 1024Z"/><path fill="url(#gold)" d="M100 1024C190 850 480 800 585 680 680 570 590 475 470 405 395 360 430 290 610 232 720 197 820 170 905 148 815 192 690 222 600 265 465 315 455 365 515 410 625 485 695 575 610 680 515 800 280 850 170 1024Z"/></svg>
  <h1 class="display" style="font-size:40px">Kept for you.</h1>
  <p class="ui" style="color:var(--muted); margin:0">47 people. This stays here as long as you want it.</p>
  <div style="display:grid; gap:10px; width:100%; max-width:420px; margin-top:30px">
    <button class="btn" onclick="go('cover')">Read it again</button>
    <button class="btn quiet">Save as PDF</button>
  </div>
  <p class="caption" style="margin-top:30px; opacity:.7">Made with Sendoff</p>
</section>

<div class="proto-switch" title="Prototype: switch theme">
  <button style="background:#F4EFE6" data-t="letterpress" aria-label="Letterpress"></button>
  <button style="background:#0F1B2D" data-t="midnight_toast" aria-label="Midnight Toast"></button>
  <button style="background:#2F4A3E" data-t="chalk" aria-label="Chalk"></button>
</div>

<script>
const entries = [
  { name: 'Dan Okafor', rel: 'Your manager, somehow', body: 'Maria. You hired me when I had no business being hired. You spent the first year quietly fixing what I broke and the next nine teaching me not to break it. Every good habit I have at work is one of yours.\n\nEnjoy the mornings.' },
  { name: 'Priya N.', rel: 'Your 2019 intern', body: 'You said "the deadline is real, the panic is optional." I have it on a sticky note. Still.' },
  { name: 'Tom Alvarez', rel: 'Facilities', voice: { dur: '0:48', transcript: 'Hey Maria, it\'s Tom. I just wanted to say... you were the only one who learned my kids\' names.' } },
  { name: 'The Wednesday lunch crew', body: 'We are not going to survive Wednesdays.', photos: 2 },
  { name: 'Sam', rel: 'The new guy', body: 'I\'ve been here six weeks. You still made time. That told me everything about this place.' },
];

const stages = ['sealed', 'cover', 'entries', 'kept'];
let idx = 0;

function go(id) {
  document.querySelectorAll('.stage').forEach(s => { s.classList.remove('active'); void s.offsetWidth; });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderEntry(i) {
  const e = entries[i];
  const host = document.getElementById('entryHost');
  let html = '<article class="entry-page">';
  if (e.photos) {
    html += '<div class="photos">';
    for (let p = 0; p < e.photos; p++) html += `<div class="ph" style="--r:${(p - 1) * 2.2}deg; --x:${(p - 1) * 6}px; --y:${p * -4}px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg></div>`;
    html += '</div>';
  }
  if (e.voice) {
    let bars = ''; let seed = 11;
    for (let b = 0; b < 36; b++) { seed = (seed * 9301 + 49297) % 233280; const h = 25 + (seed / 233280) * 75; bars += `<b style="--h:${h}%" class="${b < 14 ? 'on' : ''}"></b>`; }
    html += `<div class="voice"><div class="row"><button class="play" aria-label="Play voice note"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button><div class="wave">${bars}</div><span class="caption">${e.voice.dur}</span></div><div class="caption">${e.voice.transcript}</div></div>`;
  }
  if (e.body) html += `<p class="entry">${e.body}</p>`;
  html += `<div class="sig"><span class="signature">${e.name}${e.rel ? ' · ' + e.rel : ''}</span></div></article>`;
  host.innerHTML = html;
  host.firstChild.animate([{ opacity: 0, transform: 'translateX(24px) rotateY(6deg)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'ease', fill: 'both' });
  document.getElementById('counter').textContent = `${i + 1} of ${entries.length}`;
  document.getElementById('dots').innerHTML = entries.map((_, d) => `<b class="${d === i ? 'on' : ''}"></b>`).join('');
}

function advance() {
  const cur = document.querySelector('.stage.active').id;
  if (cur === 'cover') { idx = 0; renderEntry(0); go('entries'); }
  else if (cur === 'entries') { if (idx + 1 < entries.length) renderEntry(++idx); else go('kept'); }
}
function retreat() {
  const cur = document.querySelector('.stage.active').id;
  if (cur === 'entries') { if (idx > 0) renderEntry(--idx); else go('cover'); }
  else if (cur === 'kept') { idx = entries.length - 1; renderEntry(idx); go('entries'); }
}

const env = document.getElementById('envelope');
function breakSeal() {
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  setTimeout(() => go('cover'), 900);
}
env.addEventListener('click', breakSeal);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') breakSeal(); });

document.getElementById('cover').addEventListener('click', advance);
document.getElementById('entries').addEventListener('click', e => { if (!e.target.closest('.play')) advance(); });
let x0 = null;
document.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx < -60) advance(); else if (dx > 60) retreat(); });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') advance(); if (e.key === 'ArrowLeft') retreat(); });

document.querySelectorAll('.proto-switch button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); document.documentElement.dataset.theme = b.dataset.t; }));
if (new URLSearchParams(location.search).has('preview')) document.getElementById('previewStamp').hidden = false;
</script>
</body>
</html>
